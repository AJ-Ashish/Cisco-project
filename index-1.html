<meta charset="UTF-8" />

<title>NetSage AI — Network Troubleshooting Assistant</title>

<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #14344f;
    --accent: #2e86de;
    --green: #1e8a4c;
    --amber: #b8860b;
    --red: #c0392b;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e1e6ec;
    --text: #1c2530;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white;
    padding: 22px 28px;
  }
  header h1 { margin: 0; font-size: 24px; letter-spacing: 0.3px; }
  header p { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
  nav {
    display: flex;
    gap: 4px;
    background: var(--navy-dark);
    padding: 0 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  nav button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.75);
    padding: 12px 14px;
    font-size: 13px;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav button.active {
    color: white;
    border-bottom: 3px solid var(--accent);
    font-weight: 600;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; overflow-x: hidden; }
  @media (max-width: 600px) {
    header { padding: 16px 18px; }
    header h1 { font-size: 20px; }
    header p { font-size: 12px; }
    main { padding: 14px; }
    nav button { padding: 12px 12px; font-size: 12.5px; }
    .kv { grid-template-columns: 1fr; }
    .kv .k { margin-bottom: -2px; }
    table { font-size: 12px; }
    th, td { padding: 6px 7px; }
  }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-card .num { font-size: 30px; font-weight: 700; color: var(--navy); }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chart-grid { grid-template-columns: 1fr 1fr; }
  .chart-card { min-height: 300px; }
  .chart-card h3 { margin: 0 0 12px; font-size: 14px; color: var(--navy); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: #eef2f7; color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; position: sticky; top: 0; }
  tr:hover { background: #f8fafc; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.High { background: #fde2e1; color: var(--red); }
  .badge.Medium { background: #fdf1d6; color: var(--amber); }
  .badge.Low { background: #dff3e6; color: var(--green); }
  .badge.Accepted { background: #dff3e6; color: var(--green); }
  .badge.Edited { background: #fdf1d6; color: var(--amber); }
  .badge.Rejected { background: #fde2e1; color: var(--red); }
  .badge.confAI-High { background: #e3edfb; color: var(--accent); }
  .badge.confAI-Medium { background: #fdf1d6; color: var(--amber); }
  .badge.confAI-Low { background: #fde2e1; color: var(--red); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .toolbar input[type=text] { flex: 1; min-width: 200px; }
  .case-row { cursor: pointer; }
  .detail-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-top: 16px;
  }
  .detail-panel h3 { margin-top: 0; color: var(--navy); }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 13px; margin: 6px 0; }
  .kv .k { color: var(--muted); font-weight: 600; }
  .section-title { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin: 18px 0 8px; }
  .form-grid { display: grid; gap: 12px; }
  .form-grid label { font-size: 13px; font-weight: 600; color: var(--navy); display: block; margin-bottom: 4px; }
  .form-grid textarea, .form-grid input {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .form-grid textarea { min-height: 60px; resize: vertical; }
  button.primary {
    background: var(--accent); color: white; border: none; padding: 11px 20px;
    border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secondary {
    background: white; color: var(--navy); border: 1px solid var(--border); padding: 9px 16px;
    border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button.reject { border-color: var(--red); color: var(--red); }
  button.accept { border-color: var(--green); color: var(--green); }
  button.edit { border-color: var(--amber); color: var(--amber); }
  .ai-output {
    background: #f8fafc; border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; margin-top: 14px;
  }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; padding: 14px 0; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fix-list { margin: 6px 0 0 18px; padding: 0; font-size: 13px; }
  .notice {
    background: #eef6ff; border: 1px solid #c9e2fb; color: #1c4e80; padding: 10px 14px;
    border-radius: 8px; font-size: 12.5px; margin-bottom: 16px;
  }
  .review-log-item { border-left: 3px solid var(--border); padding: 8px 12px; margin-bottom: 8px; font-size: 13px; background: #fafbfc; border-radius: 0 6px 6px 0; }
  .review-log-item.Accepted { border-left-color: var(--green); }
  .review-log-item.Edited { border-left-color: var(--amber); }
  .review-log-item.Rejected { border-left-color: var(--red); }
  footer { text-align: center; padding: 30px; color: var(--muted); font-size: 12px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .two-col { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
  @media (max-width: 900px) { .two-col, .chart-grid { grid-template-columns: 1fr; } }
</style>

// ---------- deterministic rule checker (JS port of rule_checker.py) ----------
function ruleCheck(showText) {
  const hits = [];
  const t = showText || "";
  if (/DUP_ADDR|[Dd]uplicate address/.test(t)) hits.push("Duplicate IP address detected");
  if (/administratively down/i.test(t)) hits.push("Interface administratively down (needs 'no shutdown')");
  const trunkM = t.match(/switchport trunk allowed vlan ([\d ,]+)/i);
  if (trunkM) hits.push("Trunk allowed-VLAN list is restricted to: " + trunkM[1].trim() + " — verify required VLAN is present");
  if (/[Oo]utside (subnet|client subnet)/.test(t)) hits.push("Default gateway is outside the client's subnet range");
  const routeM = t.match(/ip route\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
  if (routeM && /unreachable/i.test(t)) hits.push("Static route next-hop " + routeM[3] + " is unreachable");
  if (/missing.*route|missing ip helper|missing.*subnets|passive-interface/i.test(t)) hits.push("Routing-related keyword/flag appears to be missing");
  return hits;
}

// ---------- AI call ----------
const SYSTEM_PROMPT = `You are NetSage AI, a network troubleshooting assistant for Cisco-style Packet Tracer labs (CCNA level: switching, routing, VLANs, DHCP, DNS, NAT, ACLs, OSPF, wireless).

You are NOT allowed to apply any fix yourself. You only diagnose and recommend. A human network engineer will review, edit, or reject every answer before it is applied to the live topology.

Rules:
1. Base your diagnosis ONLY on the symptom, topology note, and show-command output given to you. Do not invent evidence that was not provided.
2. Always return ONLY a valid JSON object, no prose, no markdown fences, matching exactly this schema:
{
  "root_cause": "one-sentence plain-English root cause",
  "osi_layer": "Layer 1 | Layer 2 | Layer 3 | Layer 4 | Layer 7 (or a combo like Layer 2/3)",
  "confidence": "High | Medium | Low",
  "evidence": "the specific line(s) from the show output that support the diagnosis",
  "next_command": "the single next show/debug command to run to confirm the diagnosis",
  "fix_steps": ["ordered list of CLI commands or actions to correct the fault"],
  "notes": "any caveat or alternate possibility worth flagging to the human reviewer"
}
3. If evidence is insufficient, say so honestly with Low confidence and suggest what additional command would confirm it.`;

let userApiKey = null;

async function diagnoseLive(symptom, topo, showOut) {
  const userPrompt = `SYMPTOM: ${symptom}\nTOPOLOGY NOTE: ${topo}\nSHOW COMMAND OUTPUT: ${showOut}\n\nDiagnose this fault. Return ONLY the JSON object described in the schema.`;
  const headers = { "Content-Type": "application/json" };
  // Outside the Claude.ai artifact runtime (e.g. GitHub Pages), there is no backend
  // to authenticate this call automatically, so a user-supplied API key is required.
  if (userApiKey) {
    headers["x-api-key"] = userApiKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: userPrompt }]
    })
  });
  if (!response.ok) {
    const errBody = await response.text();
    if (response.status === 401 || response.status === 403) {
      throw new Error("Authentication failed. If you're viewing this outside Claude.ai (e.g. GitHub Pages), enter a valid Anthropic API key above and try again.");
    }
    throw new Error("API error " + response.status + ": " + errBody.slice(0, 200));
  }
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || "").join("");
  const clean = text.replace(/```json/g, "").replace(/```/g, "").trim();
  return JSON.parse(clean);
}

function renderCaseTable() {
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  const sev = document.getElementById('filterSeverity').value;
  const status = document.getElementById('filterStatus').value;
  const body = document.getElementById('caseTableBody');
  const rows = allCases.filter(c => {
    if (sev && c.severity !== sev) return false;
    if (status && c.reviewer_status !== status) return false;
    if (q && !(c.symptom.toLowerCase().includes(q) || c.concept_tag.toLowerCase().includes(q) || c.case_id.toLowerCase().includes(q))) return false;
    return true;
  });
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="6" class="empty-state">No cases match your filters.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(c => `
    <tr class="case-row" data-id="${c.case_id}">
      <td><strong>${c.case_id}</strong>${c.live ? ' <span class="badge" style="background:#e3edfb;color:#2e86de;">LIVE</span>' : ''}</td>
      <td>${escapeHtml(c.symptom)}</td>
      <td>${escapeHtml(c.concept_tag)}</td>
      <td><span class="badge ${c.severity}">${c.severity}</span></td>
      <td><span class="badge confAI-${c.ai_confidence}">${c.ai_confidence}</span></td>
      <td><span class="badge ${c.reviewer_status}">${c.reviewer_status}</span></td>
    </tr>
  `).join('');
  body.querySelectorAll('.case-row').forEach(r => r.addEventListener('click', () => showCaseDetail(r.dataset.id)));
}

function showCaseDetail(caseId) {
  const c = allCases.find(x => x.case_id === caseId);
  if (!c) return;
  const fixSteps = Array.isArray(c.ai_fix_steps) ? c.ai_fix_steps : String(c.ai_fix_steps).split(' ; ');
  document.getElementById('caseDetail').innerHTML = `
    <div class="detail-panel">
      <h3>${c.case_id} — ${escapeHtml(c.symptom)}</h3>
      <div class="section-title">Case Evidence</div>
      <div class="kv"><div class="k">Topology</div><div>${escapeHtml(c.topology_note)}</div></div>
      <div class="kv"><div class="k">Show Output</div><div><code>${escapeHtml(c.show_outputs)}</code></div></div>
      <div class="kv"><div class="k">Rule Checker</div><div>${escapeHtml(c.rule_flags || 'No deterministic rule matched')}</div></div>

      <div class="section-title">AI Diagnosis</div>
      <div class="kv"><div class="k">Root Cause</div><div>${escapeHtml(c.ai_root_cause)}</div></div>
      <div class="kv"><div class="k">OSI Layer</div><div>${escapeHtml(c.ai_osi_layer)}</div></div>
      <div class="kv"><div class="k">Confidence</div><div><span class="badge confAI-${c.ai_confidence}">${c.ai_confidence}</span></div></div>
      <div class="kv"><div class="k">Next Command</div><div><code>${escapeHtml(c.ai_next_command)}</code></div></div>
      <div class="kv"><div class="k">Fix Steps</div><div><ul class="fix-list">${fixSteps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div></div>
      ${c.ai_notes ? `<div class="kv"><div class="k">AI Notes</div><div>${escapeHtml(c.ai_notes)}</div></div>` : ''}

      <div class="section-title">Human Review</div>
      <div class="kv"><div class="k">Status</div><div><span class="badge ${c.reviewer_status}">${c.reviewer_status}</span></div></div>
      <div class="kv"><div class="k">Reviewer Note</div><div>${escapeHtml(c.reviewer_note)}</div></div>
      <div class="kv"><div class="k">Confirmed Fault</div><div>${escapeHtml(c.expected_fault)}</div></div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Live Diagnose ----------
function renderDiagnose() {
  const el = document.getElementById('tab-diagnose');
  el.innerHTML = `
    <div class="notice">This form sends your case to the real NetSage AI prompt (Claude) for a live diagnosis, then runs the deterministic rule checker, then asks YOU to act as the human reviewer before it's logged — exactly like the pipeline in the submitted files.</div>
    <div class="notice" id="apiKeyNotice">
      <strong>Running outside Claude.ai (e.g. GitHub Pages)?</strong> Enter your own Anthropic API key to enable live diagnosis
      (get one free at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>).
      The key is kept only in this browser tab's memory — never sent anywhere except api.anthropic.com, and never saved to disk.
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." style="flex:1;" />
        <button class="secondary" id="btnSaveKey">Use this key</button>
      </div>
      <div id="apiKeyStatus" style="margin-top:6px; font-size:12px;"></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="form-grid">
          <div>
            <label>Symptom</label>
            <textarea id="inSymptom" placeholder="e.g. PC5 cannot reach the file server in VLAN 20"></textarea>
          </div>
          <div>
            <label>Topology Note</label>
            <textarea id="inTopo" placeholder="e.g. PC5 on SW2 Fa0/8 (VLAN 20); gateway on R1 Gi0/0.20"></textarea>
          </div>
          <div>
            <label>Show Command Output</label>
            <textarea id="inShow" placeholder="paste the relevant show command output here"></textarea>
          </div>
          <button class="primary" id="btnDiagnose">Diagnose with NetSage AI</button>
        </div>
        <div id="diagnoseStatus"></div>
        <div id="aiResult"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;color:var(--navy);">Try a quick example</h3>
        <p style="font-size:13px;color:var(--muted)">Click to autofill a sample case, then hit Diagnose.</p>
        <button class="secondary" id="btnSample">Load sample: DHCP pool exhausted</button>
        <div class="section-title" style="margin-top:22px;">How this maps to your submission</div>
        <p style="font-size:12.5px;color:var(--muted);line-height:1.5;">
          1. AI diagnosis uses the same JSON schema as <code>diagnose_prompt.md</code><br/>
          2. Rule checker uses the same logic as <code>rule_checker.py</code><br/>
          3. Your Accept/Edit/Reject choice is logged like <code>human_review_log.csv</code><br/>
          4. New cases you submit here appear in the Dashboard and Case Browser tabs, tagged <span class="badge" style="background:#e3edfb;color:#2e86de;">LIVE</span>.
        </p>
      </div>
    </div>
  `;

  const savedStatus = document.getElementById('apiKeyStatus');
  if (userApiKey) savedStatus.innerHTML = '✔ Using your API key for this session.';
  document.getElementById('btnSaveKey').addEventListener('click', () => {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val) { savedStatus.innerHTML = 'Please paste a key first.'; return; }
    userApiKey = val;
    savedStatus.innerHTML = '✔ Key saved for this session (memory only).';
  });

  document.getElementById('btnSample').addEventListener('click', () => {
    document.getElementById('inSymptom').value = 'PC7 assigned a 169.254.x.x address instead of a normal IP';
    document.getElementById('inTopo').value = 'PC7 on SW3 Fa0/6; DHCP server running on Router R2';
    document.getElementById('inShow').value = 'ip dhcp pool BRANCH_POOL; total addresses 5; leased 5; zero available';
  });

  document.getElementById('btnDiagnose').addEventListener('click', runLiveDiagnosis);
}

let pendingCase = null;

async function runLiveDiagnosis() {
  const symptom = document.getElementById('inSymptom').value.trim();
  const topo = document.getElementById('inTopo').value.trim();
  const showOut = document.getElementById('inShow').value.trim();
  const statusEl = document.getElementById('diagnoseStatus');
  const resultEl = document.getElementById('aiResult');
  if (!symptom || !showOut) {
    statusEl.innerHTML = `<div class="notice" style="background:#fde2e1;border-color:#f3b7b3;color:#8a2e26;">Please fill in at least the symptom and show output.</div>`;
    return;
  }
  document.getElementById('btnDiagnose').disabled = true;
  statusEl.innerHTML = `<div class="loading"><div class="spinner"></div> NetSage AI is analyzing the evidence...</div>`;
  resultEl.innerHTML = '';

  try {
    const diagnosis = await diagnoseLive(symptom, topo, showOut);
    const flags = ruleCheck(showOut);
    statusEl.innerHTML = '';
    pendingCase = { symptom, topo, showOut, diagnosis, flags };

    const fixSteps = Array.isArray(diagnosis.fix_steps) ? diagnosis.fix_steps : [String(diagnosis.fix_steps)];
    resultEl.innerHTML = `
      <div class="ai-output">
        <div class="section-title">AI Diagnosis</div>
        <div class="kv"><div class="k">Root Cause</div><div>${escapeHtml(diagnosis.root_cause)}</div></div>
        <div class="kv"><div class="k">OSI Layer</div><div>${escapeHtml(diagnosis.osi_layer)}</div></div>
        <div class="kv"><div class="k">Confidence</div><div><span class="badge confAI-${diagnosis.confidence}">${diagnosis.confidence}</span></div></div>
        <div class="kv"><div class="k">Evidence</div><div>${escapeHtml(diagnosis.evidence)}</div></div>
        <div class="kv"><div class="k">Next Command</div><div><code>${escapeHtml(diagnosis.next_command)}</code></div></div>
        <div class="kv"><div class="k">Fix Steps</div><div><ul class="fix-list">${fixSteps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div></div>
        ${diagnosis.notes ? `<div class="kv"><div class="k">Notes</div><div>${escapeHtml(diagnosis.notes)}</div></div>` : ''}

        <div class="section-title">Deterministic Rule Checker</div>
        <div>${flags.length ? flags.map(f => `<div>⚠️ ${escapeHtml(f)}</div>`).join('') : '<div style="color:var(--muted)">No deterministic rule matched.</div>'}</div>

        <div class="section-title">Your Review (required before this is logged)</div>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button class="secondary accept" id="btnAccept">✔ Accept</button>
          <button class="secondary edit" id="btnEdit">✎ Edit</button>
          <button class="secondary reject" id="btnReject">✘ Reject</button>
        </div>
        <div id="reviewNoteBox" style="margin-top:10px;"></div>
      </div>
    `;
    document.getElementById('btnAccept').addEventListener('click', () => finalizeReview('Accepted'));
    document.getElementById('btnEdit').addEventListener('click', () => promptNote('Edited'));
    document.getElementById('btnReject').addEventListener('click', () => promptNote('Rejected'));
  } catch (err) {
    statusEl.innerHTML = `<div class="notice" style="background:#fde2e1;border-color:#f3b7b3;color:#8a2e26;">Diagnosis failed: ${escapeHtml(err.message || String(err))}</div>`;
  } finally {
    document.getElementById('btnDiagnose').disabled = false;
  }
}

function promptNote(status) {
  const box = document.getElementById('reviewNoteBox');
  box.innerHTML = `
    <label style="font-size:12px;font-weight:600;color:var(--navy);">Reviewer note (why you ${status.toLowerCase()} this)</label>
    <textarea id="reviewNoteText" style="width:100%;min-height:50px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-top:4px;"></textarea>
    <button class="primary" style="margin-top:8px;" id="btnConfirmReview">Confirm ${status}</button>
  `;
  document.getElementById('btnConfirmReview').addEventListener('click', () => finalizeReview(status));
}

async function finalizeReview(status) {
  if (!pendingCase) return;
  const noteEl = document.getElementById('reviewNoteText');
  const note = noteEl ? noteEl.value.trim() : 'Matched AI diagnosis, no correction needed.';
  const d = pendingCase.diagnosis;
  const newCase = {
    case_id: 'LIVE-' + Date.now().toString().slice(-6),
    symptom: pendingCase.symptom,
    topology_note: pendingCase.topo,
    show_outputs: pendingCase.showOut,
    expected_fault: status === 'Accepted' ? d.root_cause : (note || 'Corrected by reviewer'),
    osi_layer: d.osi_layer,
    concept_tag: 'Live Submission',
    severity: 'Medium',
    ai_root_cause: d.root_cause,
    ai_confidence: d.confidence,
    ai_osi_layer: d.osi_layer,
    ai_next_command: d.next_command,
    ai_fix_steps: d.fix_steps,
    ai_notes: d.notes || '',
    rule_flags: pendingCase.flags.join(' | ') || 'No deterministic rule matched',
    reviewer_status: status,
    reviewer_note: note || (status === 'Accepted' ? 'AI diagnosis matched reviewer judgement.' : 'Reviewer correction — see note.'),
    live: true
  };
  liveCases.push(newCase);
  allCases = [...SEED_CASES, ...liveCases];
  await saveLiveCases(liveCases);

  document.getElementById('diagnoseStatus').innerHTML = `<div class="notice">Logged as <strong>${status}</strong> — case ${newCase.case_id} added to the Dashboard and Case Browser.</div>`;
  document.getElementById('reviewNoteBox').innerHTML = '';
  pendingCase = null;
}

// ---------- Responsible AI Log ----------
function renderLog() {
  const el = document.getElementById('tab-log');
  const corrected = allCases.filter(c => c.reviewer_status !== 'Accepted');
  el.innerHTML = `
    <div class="notice">Every case here is one where a human reviewer changed or rejected the AI's diagnosis. This is the required "Responsible AI" evidence — the assistant is not trusted blindly.</div>
    <div class="card stat-card" style="max-width:220px; margin-bottom:16px;">
      <div class="num">${corrected.length}</div><div class="label">Total Corrections Logged</div>
    </div>
    ${corrected.length ? corrected.map(c => `
      <div class="review-log-item ${c.reviewer_status}">
        <strong>${c.case_id}</strong> — <span class="badge ${c.reviewer_status}">${c.reviewer_status}</span><br/>
        <span style="color:var(--muted)">AI said:</span> ${escapeHtml(c.ai_root_cause)}<br/>
        <span style="color:var(--muted)">Reviewer note:</span> ${escapeHtml(c.reviewer_note)}
      </div>
    `).join('') : '<div class="empty-state">No corrections logged yet.</div>'}
  `;
}

// ---------- init ----------
async function init() {
  liveCases = await loadLiveCases();
  allCases = [...SEED_CASES, ...liveCases];
  renderDashboard();
  renderDiagnose();
}
init();
</script>
</body>
</html>
